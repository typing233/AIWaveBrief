<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; color: #333; }
  h1 { color: #1a1a2e; border-bottom: 2px solid #16213e; padding-bottom: 10px; }
  h2 { color: #16213e; margin-top: 30px; }
  h3 { color: #0f3460; }
  a { color: #e94560; text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul { padding-left: 20px; }
  li { margin-bottom: 5px; }
  hr { border: none; border-top: 1px solid #eee; margin: 20px 0; }
  .meta { color: #666; font-size: 0.9em; }
  .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; color: #999; font-size: 0.8em; }
</style>
</head>
<body>
<h1>AI Wave Brief — {{date}}</h1>
<p class="meta">共分析 {{total_articles}} 篇文章</p>
<hr>
{{content}}
<div class="footer">
  <p>由 AIWaveBrief 自动生成并推送</p>
</div>
</body>
</html>
